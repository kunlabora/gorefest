<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/gorefest.css">
<script>var t = new URLSearchParams(location.search).get('theme'); if (t) document.documentElement.dataset.theme = t;</script>
<meta charset="utf-8">
<title>GameCard preview</title>
<style>
  body { margin: 0; background: var(--surface); color: var(--ink); font: 400 16px/24px var(--font-sans); }
  .demo { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .demo-cap { margin: 0; font: 700 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }

</style>
</head>
<body>

<div class="demo" style="max-width:380px">
  <article class="gf-game gf-game--large"><span class="gf-game__rank">1</span><span class="gf-art gf-art--wide"><img alt="" data-ph="#c73a24,#f6e7c8,1.42,bands"></span>
    <div class="gf-game__body"><h3 class="gf-game__name">Heat: Pedal to the Metal</h3><p class="gf-game__meta"><svg class="gf-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>~50 min for the 5 of you</p>
    <p class="gf-game__reason"><svg class="gf-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.6 4.6 3.9 8 8.5 8.5-4.6.6-7.9 3.9-8.5 8.5-.6-4.6-3.9-7.9-8.5-8.5C8.1 11 11.4 7.6 12 3z"/></svg>Nobody's played it and everyone's likely to enjoy it.</p></div></article>
  <article class="gf-game"><span class="gf-game__rank">2</span><span class="gf-art gf-art--missing " data-hue="0"><span class="gf-art__mono" aria-hidden="true">TI</span></span>
    <div class="gf-game__body"><h3 class="gf-game__name">Twilight Imperium: Fourth Edition</h3><p class="gf-game__meta"><svg class="gf-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>~6 h for the 5 of you</p>
    <p class="gf-game__reason"><svg class="gf-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0112 7.3 4.3 4.3 0 0119.5 10c0 5.6-7.5 10-7.5 10z"/></svg>Bram brought it hoping for exactly this table.</p></div></article>
  <ul class="gf-list"><li><div class="gf-game gf-game--compact"><span class="gf-art "><img alt="" data-ph="#1f4f8f,#f2c14e,1,grid"></span><div class="gf-game__body"><h3 class="gf-game__name">Azul</h3><p class="gf-game__meta">30–45 min · light · 2–4</p></div><input class="gf-switch" type="checkbox" role="switch" aria-label="Bringing Azul" checked></div></li></ul>
</div>
<script>
document.querySelectorAll('img[data-ph]').forEach(function (img) {
  var p = img.getAttribute('data-ph').split(','), bg = p[0], fg = p[1], r = parseFloat(p[2]), m = p[3];
  var W = 300, H = Math.round(300 / r), s = '';
  if (m === 'sun') s = '<circle cx="' + W * .5 + '" cy="' + H * .45 + '" r="' + Math.min(W, H) * .28 + '" fill="' + fg + '"/><rect y="' + H * .78 + '" width="' + W + '" height="' + H * .22 + '" fill="' + fg + '" opacity=".35"/>';
  if (m === 'bands') for (var i = 0; i < 5; i++) s += '<rect x="0" y="' + (H * .18 + i * H * .13) + '" width="' + W + '" height="' + H * .06 + '" fill="' + fg + '" opacity="' + (1 - i * .16) + '"/>';
  if (m === 'peaks') s = '<path d="M0 ' + H + ' L' + W * .3 + ' ' + H * .35 + ' L' + W * .5 + ' ' + H * .6 + ' L' + W * .72 + ' ' + H * .22 + ' L' + W + ' ' + H + 'Z" fill="' + fg + '"/><circle cx="' + W * .78 + '" cy="' + H * .12 + '" r="' + W * .06 + '" fill="' + fg + '"/>';
  if (m === 'hex') for (var y = 0; y < 3; y++) for (var x = 0; x < 3; x++) { var cx = W * (.25 + x * .25 + (y % 2) * .125), cy = H * (.28 + y * .22), q = W * .1; s += '<polygon points="' + [0, 1, 2, 3, 4, 5].map(function (k) { var a = Math.PI / 3 * k + Math.PI / 6; return (cx + q * Math.cos(a)) + ',' + (cy + q * Math.sin(a)); }).join(' ') + '" fill="' + fg + '" opacity="' + (.4 + ((x + y) % 3) * .3) + '"/>'; }
  if (m === 'grid') for (var y = 0; y < 4; y++) for (var x = 0; x < 4; x++) if ((x + y) % 2 === 0 || x === y) s += '<rect x="' + (W * .12 + x * W * .2) + '" y="' + (H * .12 + y * H * .2) + '" width="' + W * .16 + '" height="' + H * .16 + '" rx="6" fill="' + fg + '" opacity="' + (x === y ? 1 : .55) + '"/>';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '"><rect width="100%" height="100%" fill="' + bg + '"/>' + s + '</svg>';
  var u = 'data:image/svg+xml,' + encodeURIComponent(svg);
  img.src = u; img.parentNode.style.setProperty('--art', 'url("' + u + '")');
});
</script>
</body>
</html>
