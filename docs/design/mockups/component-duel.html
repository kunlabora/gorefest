<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/gorefest.css">
<script>var t = new URLSearchParams(location.search).get('theme'); if (t) document.documentElement.dataset.theme = t;</script>
<meta charset="utf-8">
<title>Duel preview</title>
<style>
  body { margin: 0; background: var(--surface); color: var(--ink); font: 400 16px/24px var(--font-sans); }
  .demo { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .demo-cap { margin: 0; font: 700 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }

</style>
</head>
<body>

<div class="demo" style="max-width:380px">
  <form class="gf-wizard__form" hx-post="/gamedays/7/wizard" hx-target="#wizard" hx-swap="outerHTML">
    <div class="gf-duel gf-deal">
      <button class="gf-pick" name="answer" value="A"><span class="gf-pick__key" aria-hidden="true">A</span><span class="gf-art "><img alt="" data-ph="#2f6f5e,#f1d27a,1,hex"></span><span class="gf-pick__name">Cascadia</span><span class="gf-pick__facts">30–45 min · light · 1–4</span><span class="gf-spin" aria-hidden="true"></span></button>
      <span class="gf-duel__or" aria-hidden="true">or</span>
      <button class="gf-pick" name="answer" value="B" aria-busy="true"><span class="gf-pick__key" aria-hidden="true">B</span><span class="gf-art "><img alt="" data-ph="#1d4a5a,#f0a35e,0.72,peaks"></span><span class="gf-pick__name">Spirit Island</span><span class="gf-pick__facts">90–120 min · heavy · 1–4</span><span class="gf-spin" aria-hidden="true"></span></button>
    </div>
    <div class="gf-answers">
      <button class="gf-answer" name="answer" value="UNPLAYED"><svg class="gf-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12.5" rx="2"/><path d="M4 11h16M9.5 7l1-3h3l1 3"/></svg>Haven't played</button>
      <button class="gf-answer" name="answer" value="BOTH_MEH"><svg class="gf-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 15h7"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.6"/></svg>Both meh</button>
      <button class="gf-answer gf-answer--great" name="answer" value="BOTH_GREAT"><svg class="gf-icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>Both great</button>
    </div>
  </form>
  <p class="demo-cap">B shown mid-request (aria-busy / .htmx-request)</p>
</div>
<script>
document.querySelectorAll('img[data-ph]').forEach(function (img) {
  var p = img.getAttribute('data-ph').split(','), bg = p[0], fg = p[1], r = parseFloat(p[2]), m = p[3];
  var W = 300, H = Math.round(300 / r), s = '';
  if (m === 'sun') s = '<circle cx="' + W * .5 + '" cy="' + H * .45 + '" r="' + Math.min(W, H) * .28 + '" fill="' + fg + '"/><rect y="' + H * .78 + '" width="' + W + '" height="' + H * .22 + '" fill="' + fg + '" opacity=".35"/>';
  if (m === 'bands') for (var i = 0; i < 5; i++) s += '<rect x="0" y="' + (H * .18 + i * H * .13) + '" width="' + W + '" height="' + H * .06 + '" fill="' + fg + '" opacity="' + (1 - i * .16) + '"/>';
  if (m === 'peaks') s = '<path d="M0 ' + H + ' L' + W * .3 + ' ' + H * .35 + ' L' + W * .5 + ' ' + H * .6 + ' L' + W * .72 + ' ' + H * .22 + ' L' + W + ' ' + H + 'Z" fill="' + fg + '"/><circle cx="' + W * .78 + '" cy="' + H * .12 + '" r="' + W * .06 + '" fill="' + fg + '"/>';
  if (m === 'hex') for (var y = 0; y < 3; y++) for (var x = 0; x < 3; x++) { var cx = W * (.25 + x * .25 + (y % 2) * .125), cy = H * (.28 + y * .22), q = W * .1; s += '<polygon points="' + [0, 1, 2, 3, 4, 5].map(function (k) { var a = Math.PI / 3 * k + Math.PI / 6; return (cx + q * Math.cos(a)) + ',' + (cy + q * Math.sin(a)); }).join(' ') + '" fill="' + fg + '" opacity="' + (.4 + ((x + y) % 3) * .3) + '"/>'; }
  if (m === 'grid') for (var y = 0; y < 4; y++) for (var x = 0; x < 4; x++) if ((x + y) % 2 === 0 || x === y) s += '<rect x="' + (W * .12 + x * W * .2) + '" y="' + (H * .12 + y * H * .2) + '" width="' + W * .16 + '" height="' + H * .16 + '" rx="6" fill="' + fg + '" opacity="' + (x === y ? 1 : .55) + '"/>';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '"><rect width="100%" height="100%" fill="' + bg + '"/>' + s + '</svg>';
  var u = 'data:image/svg+xml,' + encodeURIComponent(svg);
  img.src = u; img.parentNode.style.setProperty('--art', 'url("' + u + '")');
});
</script>
</body>
</html>
