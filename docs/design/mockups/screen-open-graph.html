<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/gorefest.css">
<script>var t = new URLSearchParams(location.search).get('theme'); if (t) document.documentElement.dataset.theme = t;</script>
<meta charset="utf-8">
<title>Open Graph image</title>
<style>
  body { margin: 0; background: var(--surface); color: var(--ink); font: 400 16px/24px var(--font-sans); }
  .demo { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .demo-cap { margin: 0; font: 700 12px/16px var(--font-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }

  body { background: var(--surface-sunk); }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--light-yellow); color: var(--charcoal-brown); font-family: var(--font-sans); }
  .og-dice { position: absolute; right: 0; top: 0; width: 520px; height: 630px; }
  .d-ink { fill: var(--charcoal-brown); } .d-brand { fill: var(--chocolate); } .d-olive { fill: var(--olive-bark); } .d-bronze { fill: var(--golden-bronze); }
  .p-surf, .p-yel { fill: var(--light-yellow); } .p-ink { fill: var(--charcoal-brown); }
  .og-words { position: absolute; left: 72px; top: 72px; bottom: 72px; width: 600px; display: flex; flex-direction: column; }
  .og-host { margin: 0 0 12px; font: 700 30px/36px var(--font-sans); color: var(--olive-bark); }
  .og-title { margin: 0 0 32px; font: 800 120px/.95 var(--font-display); letter-spacing: -.03em; }
  .og-fact { margin: 0; font: 400 36px/48px var(--font-sans); }
  .og-shelf { margin: auto 0 0; font: 700 34px/40px var(--font-sans); }
  .og-shelf span { background: var(--chocolate); color: #1e2119; padding: 2px 12px; border-radius: 10px; }

</style>
</head>
<body>
<div class="og">
<svg class="og-dice" viewBox="0 0 520 630" aria-hidden="true">
<rect class="d-ink" x="300" y="-40" width="260" height="360" rx="20"/>
<circle class="p-surf" cx="360" cy="40" r="16"/><circle class="p-surf" cx="460" cy="40" r="16"/><circle class="p-surf" cx="360" cy="120" r="16"/><circle class="p-surf" cx="460" cy="120" r="16"/><circle class="p-surf" cx="360" cy="200" r="16"/><circle class="p-surf" cx="460" cy="200" r="16"/>
<rect class="d-brand" x="40" y="330" width="240" height="240" rx="20"/>
<circle class="p-ink" cx="100" cy="390" r="18"/><circle class="p-ink" cx="220" cy="390" r="18"/><circle class="p-ink" cx="160" cy="450" r="18"/><circle class="p-ink" cx="100" cy="510" r="18"/><circle class="p-ink" cx="220" cy="510" r="18"/>
<rect class="d-olive" x="300" y="410" width="160" height="160" rx="16"/><circle class="p-yel" cx="340" cy="450" r="14"/><circle class="p-yel" cx="380" cy="490" r="14"/><circle class="p-yel" cx="420" cy="530" r="14"/>
<rect class="d-bronze" x="120" y="180" width="140" height="130" rx="16"/><circle class="p-ink" cx="160" cy="220" r="12"/><circle class="p-ink" cx="220" cy="270" r="12"/>
</svg>
<div class="og-words"><p class="og-host">Anna invites you</p><h1 class="og-title">Gorefest #7</h1>
<p class="og-fact">Saturday 12 October · 11:00</p><p class="og-fact">Anna's place, Leuven</p>
<p class="og-shelf"><span>23 games</span> on the shelf · 7 going</p></div></div>
<script>
document.querySelectorAll('img[data-ph]').forEach(function (img) {
  var p = img.getAttribute('data-ph').split(','), bg = p[0], fg = p[1], r = parseFloat(p[2]), m = p[3];
  var W = 300, H = Math.round(300 / r), s = '';
  if (m === 'sun') s = '<circle cx="' + W * .5 + '" cy="' + H * .45 + '" r="' + Math.min(W, H) * .28 + '" fill="' + fg + '"/><rect y="' + H * .78 + '" width="' + W + '" height="' + H * .22 + '" fill="' + fg + '" opacity=".35"/>';
  if (m === 'bands') for (var i = 0; i < 5; i++) s += '<rect x="0" y="' + (H * .18 + i * H * .13) + '" width="' + W + '" height="' + H * .06 + '" fill="' + fg + '" opacity="' + (1 - i * .16) + '"/>';
  if (m === 'peaks') s = '<path d="M0 ' + H + ' L' + W * .3 + ' ' + H * .35 + ' L' + W * .5 + ' ' + H * .6 + ' L' + W * .72 + ' ' + H * .22 + ' L' + W + ' ' + H + 'Z" fill="' + fg + '"/><circle cx="' + W * .78 + '" cy="' + H * .12 + '" r="' + W * .06 + '" fill="' + fg + '"/>';
  if (m === 'hex') for (var y = 0; y < 3; y++) for (var x = 0; x < 3; x++) { var cx = W * (.25 + x * .25 + (y % 2) * .125), cy = H * (.28 + y * .22), q = W * .1; s += '<polygon points="' + [0, 1, 2, 3, 4, 5].map(function (k) { var a = Math.PI / 3 * k + Math.PI / 6; return (cx + q * Math.cos(a)) + ',' + (cy + q * Math.sin(a)); }).join(' ') + '" fill="' + fg + '" opacity="' + (.4 + ((x + y) % 3) * .3) + '"/>'; }
  if (m === 'grid') for (var y = 0; y < 4; y++) for (var x = 0; x < 4; x++) if ((x + y) % 2 === 0 || x === y) s += '<rect x="' + (W * .12 + x * W * .2) + '" y="' + (H * .12 + y * H * .2) + '" width="' + W * .16 + '" height="' + H * .16 + '" rx="6" fill="' + fg + '" opacity="' + (x === y ? 1 : .55) + '"/>';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '"><rect width="100%" height="100%" fill="' + bg + '"/>' + s + '</svg>';
  var u = 'data:image/svg+xml,' + encodeURIComponent(svg);
  img.src = u; img.parentNode.style.setProperty('--art', 'url("' + u + '")');
});
</script>
</body>
</html>
